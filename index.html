<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Aribulan</title>
<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
}
img {
    max-width: 100%;
    max-height: 100%;
}
body {
    position: relative;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}
.game-link {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 2;
    width: 40px;
    height: 40px;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    color: #f8fbff;
    text-decoration: none;
    text-shadow:
        0 0 6px rgba(255, 255, 255, 0.85),
        0 0 14px rgba(0, 208, 255, 0.95),
        0 0 22px rgba(255, 0, 190, 0.75);
    transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
}
.game-link:hover,
.game-link:focus-visible {
    transform: translateY(-1px);
    outline: none;
}
.game-link svg {
    width: 24px;
    height: 24px;
    filter:
        drop-shadow(0 0 5px rgba(255, 255, 255, 0.9))
        drop-shadow(0 0 10px rgba(0, 208, 255, 0.95))
        drop-shadow(0 0 16px rgba(255, 0, 190, 0.75));
}
@media (max-width: 520px) {
    .game-link {
        top: 12px;
        left: 12px;
        width: 36px;
        height: 36px;
    }
    .game-link svg {
        width: 22px;
        height: 22px;
    }
}
</style>
</head>
<body>
    <a class="game-link" href="snake.html" aria-label="Snake game" title="Snake">
        <svg viewBox="0 0 64 64" role="img" aria-hidden="true">
            <path d="M14 43c0 7 6 11 14 11h12c6 0 10-4 10-10s-4-10-10-10H24c-5 0-8-3-8-7s3-7 8-7h22" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M46 20l7-5-7-5" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="45" cy="17" r="1.8" fill="currentColor"/>
        </svg>
    </a>
    <img src="aribulan-neon.png">
</body>
</html>
