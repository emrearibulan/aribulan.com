<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake | Aribulan</title>
<style>
:root {
    --cyan: #20e7ff;
    --pink: #ff2bd6;
    --yellow: #ffe94a;
    --panel: rgba(0, 0, 0, 0.46);
}
* {
    box-sizing: border-box;
}
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #f8fbff;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}
body {
    min-height: 100%;
    background:
        linear-gradient(rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.34)),
        url("assets/star-background.png") center / cover no-repeat #000;
}
.home-link {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 4;
    width: 38px;
    height: 38px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #f8fbff;
    text-decoration: none;
    filter:
        drop-shadow(0 0 5px rgba(255, 255, 255, 0.78))
        drop-shadow(0 0 10px rgba(32, 231, 255, 0.9))
        drop-shadow(0 0 14px rgba(255, 43, 214, 0.65));
    transition: transform 160ms ease;
}
.home-link:hover,
.home-link:focus-visible {
    transform: translateY(-1px);
    outline: none;
}
.home-link svg {
    width: 24px;
    height: 24px;
}
.hud {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 4;
    display: flex;
    gap: 12px;
}
.metric {
    min-width: 92px;
    padding: 8px 12px;
    border: 1px solid rgba(32, 231, 255, 0.34);
    border-radius: 6px;
    background: var(--panel);
    box-shadow:
        0 0 10px rgba(32, 231, 255, 0.18),
        inset 0 0 12px rgba(255, 43, 214, 0.08);
}
.metric span {
    display: block;
    color: rgba(248, 251, 255, 0.62);
    font-size: 10px;
    letter-spacing: 1.7px;
    text-transform: uppercase;
}
.metric strong {
    display: block;
    margin-top: 3px;
    color: #fff;
    font-size: 20px;
    line-height: 1;
    text-shadow:
        0 0 8px rgba(32, 231, 255, 0.9),
        0 0 16px rgba(255, 43, 214, 0.72);
}
.stage {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    padding: 82px 18px 28px;
}
.game-shell {
    position: relative;
    width: min(86vmin, 720px);
    aspect-ratio: 1;
}
canvas {
    display: block;
    width: 100%;
    height: 100%;
    border: 1px solid rgba(32, 231, 255, 0.32);
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.42);
    box-shadow:
        0 0 18px rgba(32, 231, 255, 0.2),
        0 0 36px rgba(255, 43, 214, 0.12),
        inset 0 0 28px rgba(0, 0, 0, 0.78);
    image-rendering: auto;
}
.overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: grid;
    place-items: center;
    padding: 18px;
    background: radial-gradient(circle, rgba(0, 0, 0, 0.22), rgba(0, 0, 0, 0.66));
    opacity: 0;
    pointer-events: none;
    transition: opacity 160ms ease;
}
.overlay.is-visible {
    opacity: 1;
    pointer-events: auto;
}
.menu {
    display: grid;
    justify-items: center;
    gap: 16px;
}
.status {
    margin: 0;
    color: #fff;
    font-size: clamp(28px, 6vmin, 52px);
    line-height: 1;
    text-transform: uppercase;
    letter-spacing: 3px;
    text-shadow:
        0 0 8px rgba(255, 255, 255, 0.9),
        0 0 18px rgba(32, 231, 255, 0.94),
        0 0 28px rgba(255, 43, 214, 0.8);
}
.play-button {
    min-width: 120px;
    min-height: 44px;
    border: 1px solid rgba(255, 233, 74, 0.76);
    border-radius: 6px;
    color: #fff;
    background: rgba(0, 0, 0, 0.54);
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow:
        0 0 12px rgba(255, 233, 74, 0.35),
        0 0 24px rgba(255, 43, 214, 0.18),
        inset 0 0 12px rgba(255, 233, 74, 0.12);
    text-shadow:
        0 0 8px rgba(255, 255, 255, 0.82),
        0 0 16px rgba(255, 233, 74, 0.9);
}
.play-button:hover,
.play-button:focus-visible {
    transform: translateY(-1px);
    outline: none;
}
@media (max-width: 620px) {
    .home-link {
        top: 12px;
        left: 12px;
        width: 34px;
        height: 34px;
    }
    .hud {
        top: 12px;
        right: 12px;
        gap: 8px;
    }
    .metric {
        min-width: 72px;
        padding: 7px 9px;
    }
    .metric strong {
        font-size: 18px;
    }
    .stage {
        padding: 76px 12px 18px;
    }
    .game-shell {
        width: min(94vmin, 720px);
    }
}
</style>
</head>
<body>
    <a class="home-link" href="index.html" aria-label="Home" title="Home">
        <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M14 34 32 17l18 17" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M20 31v18h24V31" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </a>
    <div class="hud" aria-live="polite">
        <div class="metric">
            <span>Score</span>
            <strong id="score">0</strong>
        </div>
        <div class="metric">
            <span>Best</span>
            <strong id="best">0</strong>
        </div>
    </div>
    <main class="stage">
        <div class="game-shell">
            <canvas id="game" width="640" height="640" tabindex="0" aria-label="Snake game"></canvas>
            <div class="overlay is-visible" id="overlay">
                <div class="menu">
                    <p class="status" id="status">Snake</p>
                    <button class="play-button" id="playButton" type="button">Play</button>
                </div>
            </div>
        </div>
    </main>
<script>
(() => {
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const overlay = document.getElementById("overlay");
    const statusEl = document.getElementById("status");
    const playButton = document.getElementById("playButton");

    const grid = 20;
    const tile = canvas.width / grid;
    const stepMs = 140;
    const directions = {
        ArrowUp: { x: 0, y: -1 },
        ArrowDown: { x: 0, y: 1 },
        ArrowLeft: { x: -1, y: 0 },
        ArrowRight: { x: 1, y: 0 },
        w: { x: 0, y: -1 },
        s: { x: 0, y: 1 },
        a: { x: -1, y: 0 },
        d: { x: 1, y: 0 }
    };
    const assets = {
        head: loadImage("assets/snake-head.png"),
        body: loadImage("assets/snake-body.png"),
        tail: loadImage("assets/snake-tail.png"),
        food: loadImage("assets/food.png"),
        background: loadImage("assets/star-background.png")
    };

    let snake;
    let food;
    let direction;
    let queuedDirection;
    let score;
    let best = Number(localStorage.getItem("aribulanSnakeBest") || 0);
    let running = false;
    let hasStarted = false;
    let lastTime = 0;
    let accumulator = 0;
    let touchStart = null;

    bestEl.textContent = best;
    reset();
    draw();

    Promise.all(Object.values(assets).map((image) => image.decode().catch(() => {}))).then(draw);

    playButton.addEventListener("click", start);
    window.addEventListener("keydown", onKeyDown);
    canvas.addEventListener("pointerdown", onPointerDown);
    canvas.addEventListener("pointerup", onPointerUp);

    requestAnimationFrame(loop);

    function loadImage(src) {
        const image = new Image();
        image.src = src;
        return image;
    }

    function reset() {
        snake = [
            { x: 6, y: 10 },
            { x: 5, y: 10 },
            { x: 4, y: 10 }
        ];
        direction = { x: 1, y: 0 };
        queuedDirection = { ...direction };
        score = 0;
        scoreEl.textContent = score;
        food = placeFood();
    }

    function start() {
        reset();
        hasStarted = true;
        running = true;
        lastTime = 0;
        accumulator = 0;
        overlay.classList.remove("is-visible");
        canvas.focus();
    }

    function loop(time) {
        if (!lastTime) {
            lastTime = time;
        }
        const delta = time - lastTime;
        lastTime = time;

        if (running) {
            accumulator += delta;
            while (accumulator >= stepMs) {
                tick();
                accumulator -= stepMs;
            }
        }

        draw();
        requestAnimationFrame(loop);
    }

    function tick() {
        if (!isOpposite(direction, queuedDirection)) {
            direction = { ...queuedDirection };
        }

        const head = snake[0];
        const next = { x: head.x + direction.x, y: head.y + direction.y };
        const hitsWall = next.x < 0 || next.x >= grid || next.y < 0 || next.y >= grid;
        const hitsSelf = snake.some((part) => part.x === next.x && part.y === next.y);

        if (hitsWall || hitsSelf) {
            endGame();
            return;
        }

        snake.unshift(next);
        if (next.x === food.x && next.y === food.y) {
            score += 10;
            scoreEl.textContent = score;
            if (score > best) {
                best = score;
                bestEl.textContent = best;
                localStorage.setItem("aribulanSnakeBest", String(best));
            }
            food = placeFood();
        } else {
            snake.pop();
        }
    }

    function endGame() {
        running = false;
        statusEl.textContent = "Again";
        playButton.textContent = "Restart";
        overlay.classList.add("is-visible");
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground();
        drawGridGlow();
        if (hasStarted) {
            drawFood();
            drawSnake();
        }
    }

    function drawBackground() {
        if (assets.background.complete) {
            ctx.drawImage(assets.background, 0, 0, canvas.width, canvas.height);
        }
        ctx.fillStyle = "rgba(0, 0, 0, 0.32)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawGridGlow() {
        ctx.save();
        ctx.strokeStyle = "rgba(32, 231, 255, 0.055)";
        ctx.lineWidth = 1;
        for (let i = 1; i < grid; i += 1) {
            const p = Math.round(i * tile) + 0.5;
            ctx.beginPath();
            ctx.moveTo(p, 0);
            ctx.lineTo(p, canvas.height);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, p);
            ctx.lineTo(canvas.width, p);
            ctx.stroke();
        }
        ctx.restore();
    }

    function drawFood() {
        drawSprite(assets.food, food.x, food.y, 0, 0.88);
    }

    function drawSnake() {
        snake.forEach((part, index) => {
            if (index === 0) {
                drawSprite(assets.head, part.x, part.y, angleFor(direction), 1.18);
                return;
            }

            if (index === snake.length - 1) {
                const beforeTail = snake[index - 1];
                const tailDirection = {
                    x: beforeTail.x - part.x,
                    y: beforeTail.y - part.y
                };
                drawSprite(assets.tail, part.x, part.y, angleFor(tailDirection) + Math.PI, 1.08);
                return;
            }

            const previous = snake[index - 1];
            const next = snake[index + 1];
            const bodyDirection = {
                x: previous.x - next.x,
                y: previous.y - next.y
            };
            drawSprite(assets.body, part.x, part.y, angleFor(bodyDirection), 1.04);
        });
    }

    function drawSprite(image, x, y, angle, scale) {
        if (!image.complete) {
            return;
        }
        const size = tile * scale;
        const centerX = x * tile + tile / 2;
        const centerY = y * tile + tile / 2;

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angle);
        ctx.drawImage(image, -size / 2, -size / 2, size, size);
        ctx.restore();
    }

    function placeFood() {
        let candidate;
        do {
            candidate = {
                x: Math.floor(Math.random() * grid),
                y: Math.floor(Math.random() * grid)
            };
        } while (snake.some((part) => part.x === candidate.x && part.y === candidate.y));
        return candidate;
    }

    function onKeyDown(event) {
        const next = directions[event.key];
        if (!next) {
            if (event.key === " " || event.key === "Enter") {
                event.preventDefault();
                start();
            }
            return;
        }

        event.preventDefault();
        if (!running) {
            start();
        }
        if (!isOpposite(direction, next)) {
            queuedDirection = { ...next };
        }
    }

    function onPointerDown(event) {
        touchStart = { x: event.clientX, y: event.clientY };
    }

    function onPointerUp(event) {
        if (!touchStart) {
            return;
        }
        const dx = event.clientX - touchStart.x;
        const dy = event.clientY - touchStart.y;
        touchStart = null;

        if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) {
            if (!running) {
                start();
            }
            return;
        }

        const next = Math.abs(dx) > Math.abs(dy)
            ? { x: Math.sign(dx), y: 0 }
            : { x: 0, y: Math.sign(dy) };

        if (!running) {
            start();
        }
        if (!isOpposite(direction, next)) {
            queuedDirection = next;
        }
    }

    function isOpposite(current, next) {
        return current.x + next.x === 0 && current.y + next.y === 0;
    }

    function angleFor(vector) {
        if (vector.x > 0) {
            return 0;
        }
        if (vector.x < 0) {
            return Math.PI;
        }
        if (vector.y > 0) {
            return Math.PI / 2;
        }
        return -Math.PI / 2;
    }
})();
</script>
</body>
</html>
